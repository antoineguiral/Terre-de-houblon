# /etc/apache2/sites-available/thegame.leperelamer.fr.conf
# certbot --apache en tire thegame.leperelamer.fr-le-ssl.conf (HTTPS) et ajoute ici la redirection vers HTTPS.
<VirtualHost *:80>
    ServerName thegame.leperelamer.fr
    DocumentRoot /srv/brassins

    <Directory /srv/brassins>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    # Seuls index.html et les modules du navigateur (client/, moteur/) sont publics
    <LocationMatch "^/(serveur|test|outils|deploiement|node_modules|package|README|DEPLOIEMENT|\.)">
        Require all denied
    </LocationMatch>

    # Serveur de jeu : WebSocket sur /ws, santé sur /sante, désinscription des e-mails sur /desabonner
    ProxyPreserveHost On
    ProxyPass        /ws    ws://127.0.0.1:3211/ws
    ProxyPass        /sante http://127.0.0.1:3211/sante
    ProxyPassReverse /sante http://127.0.0.1:3211/sante
    ProxyPass        /desabonner http://127.0.0.1:3211/desabonner

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    <FilesMatch "\.(html|js)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/brassins.error.log
    CustomLog ${APACHE_LOG_DIR}/brassins.access.log combined
</VirtualHost>
