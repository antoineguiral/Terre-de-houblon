# /etc/apache2/sites-available/jeu.leperelamer.fr.conf
# certbot --apache en tire jeu.leperelamer.fr-le-ssl.conf (HTTPS) et ajoute ici la redirection vers HTTPS.
<VirtualHost *:80>
    ServerName jeu.leperelamer.fr
    DocumentRoot /srv/terres-de-houblon

    <Directory /srv/terres-de-houblon>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    # Seuls index.html et les modules du navigateur (client/, moteur/) sont publics
    <LocationMatch "^/(serveur|test|outils|deploiement|node_modules|package|README|DEPLOIEMENT|\.)">
        Require all denied
    </LocationMatch>

    # Serveur de jeu : WebSocket sur /ws, santé sur /sante
    ProxyPreserveHost On
    ProxyPass        /ws    ws://127.0.0.1:3210/ws
    ProxyPass        /sante http://127.0.0.1:3210/sante
    ProxyPassReverse /sante http://127.0.0.1:3210/sante

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    <FilesMatch "\.(html|js)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/jeu.error.log
    CustomLog ${APACHE_LOG_DIR}/jeu.access.log combined
</VirtualHost>
